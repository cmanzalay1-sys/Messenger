<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger - Voice & Video Call</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }

    .card { width: 100%; max-width: 900px; background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 16px; }
    .auth-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

    .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; width: 100%; max-width: 900px; margin-bottom: 16px; }
    .video-box { background: #1e293b; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16/9; border: 1px solid #334155; }
    video { width: 100%; height: 100%; object-fit: cover; background: #000; }
    .label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.65); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; }

    .controls, .room-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; background: #3b82f6; color: white; transition: 0.2s; }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    button.google { background: #ffffff; color: #0f172a; }
    button.google:hover { background: #e2e8f0; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }

    input { padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 0.9rem; flex: 1; min-width: 220px; }
    .status { font-size: 0.85rem; color: #94a3b8; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>Messenger Voice & Video Call</h1>

  <!-- 1. Firebase Google Sign-In -->
  <div class="card auth-bar">
    <div id="loggedOutView" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
      <span style="color: #94a3b8; font-size: 0.9rem;">Sign in with Google to start or join a call</span>
      <button id="btnSignIn" class="google">Sign in with Google</button>
    </div>

    <div id="loggedInView" class="user-info" style="display: none; width: 100%;">
      <img id="userPic" src="" alt="Avatar" />
      <div>
        <div id="userName" style="font-weight: 600; font-size: 0.95rem;"></div>
        <div id="userEmail" style="font-size: 0.8rem; color: #94a3b8;"></div>
      </div>
      <button id="btnSignOut" class="secondary" style="margin-left: auto;">Sign Out</button>
    </div>
  </div>

  <!-- 2. Video Feeds -->
  <div class="videos">
    <div class="video-box">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="label" id="localLabel">You (Local)</div>
    </div>
    <div class="video-box">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label">Remote Peer</div>
    </div>
  </div>

  <!-- 3. Media & Call Room Controls -->
  <div class="card">
    <div class="controls" style="margin-bottom: 14px;">
      <button id="btnVideoCall" disabled>1. Enable Video + Mic</button>
      <button id="btnVoiceCall" disabled>1. Enable Mic Only</button>
      <button id="btnMute" class="secondary" disabled>Mute Mic</button>
      <button id="btnCam" class="secondary" disabled>Turn Off Cam</button>
      <button id="btnHangup" class="danger" disabled>Hang Up</button>
    </div>

    <div class="room-controls">
      <button id="btnCreateRoom" disabled>2. Create Call Room</button>
      <input id="roomIdInput" type="text" placeholder="Enter Call Room ID to join..." />
      <button id="btnCopyRoom" class="secondary" disabled>Copy ID</button>
      <button id="btnJoinRoom" disabled>3. Join Call Room</button>
    </div>
    <p class="status" id="statusText">Status: Waiting for Google Sign-In...</p>
  </div>

  <!-- Firebase Modular SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, addDoc, onSnapshot, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXznQ-Nv4JlIuK0atn3N4qPCW8R8GpeOs",
      authDomain: "messenger-85a88.firebaseapp.com",
      projectId: "messenger-85a88",
      storageBucket: "messenger-85a88.firebasestorage.app",
      messagingSenderId: "49360047185",
      appId: "1:49360047185:web:3929fedafdaa11c3a8fc70",
      measurementId: "G-CKBH8VFQFN"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const rtcConfig = {
      iceServers: [
        { urls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }
      ]
    };

    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let currentRoomId = null;
    let isMuted = false;
    let isCamOff = false;

    const statusText = document.getElementById("statusText");
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const roomIdInput = document.getElementById("roomIdInput");

    const btnSignIn = document.getElementById("btnSignIn");
    const btnSignOut = document.getElementById("btnSignOut");
    const btnVideoCall = document.getElementById("btnVideoCall");
    const btnVoiceCall = document.getElementById("btnVoiceCall");
    const btnMute = document.getElementById("btnMute");
    const btnCam = document.getElementById("btnCam");
    const btnHangup = document.getElementById("btnHangup");
    const btnCreateRoom = document.getElementById("btnCreateRoom");
    const btnCopyRoom = document.getElementById("btnCopyRoom");
    const btnJoinRoom = document.getElementById("btnJoinRoom");

    // 1. Google Sign-In
    btnSignIn.onclick = () => signInWithPopup(auth, provider).catch(err => alert(err.message));
    btnSignOut.onclick = () => {
      hangUp();
      signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("loggedOutView").style.display = "none";
        document.getElementById("loggedInView").style.display = "flex";
        document.getElementById("userName").textContent = user.displayName;
        document.getElementById("userEmail").textContent = user.email;
        document.getElementById("userPic").src = user.photoURL;
        document.getElementById("localLabel").textContent = `You (${user.displayName})`;

        btnVideoCall.disabled = false;
        btnVoiceCall.disabled = false;
        statusText.textContent = "Status: Signed in. Enable camera/mic to start.";
      } else {
        document.getElementById("loggedOutView").style.display = "flex";
        document.getElementById("loggedInView").style.display = "none";
        btnVideoCall.disabled = true;
        btnVoiceCall.disabled = true;
        statusText.textContent = "Status: Waiting for Google Sign-In...";
      }
    });

    // 2. Start Local Media
    async function startMedia(withVideo) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: withVideo });
        remoteStream = new MediaStream();

        localVideo.srcObject = localStream;
        remoteVideo.srcObject = remoteStream;

        btnVideoCall.disabled = true;
        btnVoiceCall.disabled = true;
        btnMute.disabled = false;
        btnCam.disabled = !withVideo;
        btnHangup.disabled = false;
        btnCreateRoom.disabled = false;
        btnJoinRoom.disabled = false;
        statusText.textContent = "Status: Media ready. Create a Call Room or enter an ID to join.";
      } catch (err) {
        alert("Media access error: " + err.message);
      }
    }

    btnVideoCall.onclick = () => startMedia(true);
    btnVoiceCall.onclick = () => startMedia(false);

    // 3. Create Room (Caller)
    btnCreateRoom.onclick = async () => {
      btnCreateRoom.disabled = true;
      btnJoinRoom.disabled = true;

      pc = new RTCPeerConnection(rtcConfig);
      registerPeerListeners();

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const roomRef = doc(collection(db, "calls"));
      currentRoomId = roomRef.id;
      roomIdInput.value = currentRoomId;
      btnCopyRoom.disabled = false;

      const callerCandidatesCollection = collection(roomRef, "callerCandidates");
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          addDoc(callerCandidatesCollection, event.candidate.toJSON());
        }
      };

      const offerDescription = await pc.createOffer();
      await pc.setLocalDescription(offerDescription);

      await setDoc(roomRef, {
        offer: { type: offerDescription.type, sdp: offerDescription.sdp },
        createdBy: auth.currentUser.email
      });

      statusText.textContent = `Room created! Share this ID with your peer: ${currentRoomId}`;

      onSnapshot(roomRef, (snapshot) => {
        const data = snapshot.data();
        if (!pc.currentRemoteDescription && data?.answer) {
          const answerDescription = new RTCSessionDescription(data.answer);
          pc.setRemoteDescription(answerDescription);
          statusText.textContent = "Status: Connected!";
        }
      });

      onSnapshot(collection(roomRef, "calleeCandidates"), (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === "added") {
            pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });
    };

    btnCopyRoom.onclick = () => {
      navigator.clipboard.writeText(roomIdInput.value);
      btnCopyRoom.textContent = "Copied!";
      setTimeout(() => (btnCopyRoom.textContent = "Copy ID"), 1500);
    };

    // 4. Join Room (Callee)
    btnJoinRoom.onclick = async () => {
      const roomId = roomIdInput.value.trim();
      if (!roomId) return alert("Enter a Call Room ID first.");

      const roomRef = doc(db, "calls", roomId);
      const roomSnapshot = await getDoc(roomRef);
      if (!roomSnapshot.exists()) return alert("Call Room not found!");

      currentRoomId = roomId;
      btnCreateRoom.disabled = true;
      btnJoinRoom.disabled = true;

      pc = new RTCPeerConnection(rtcConfig);
      registerPeerListeners();

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const calleeCandidatesCollection = collection(roomRef, "calleeCandidates");
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          addDoc(calleeCandidatesCollection, event.candidate.toJSON());
        }
      };

      const offer = roomSnapshot.data().offer;
      await pc.setRemoteDescription(new RTCSessionDescription(offer));

      const answerDescription = await pc.createAnswer();
      await pc.setLocalDescription(answerDescription);

      await updateDoc(roomRef, {
        answer: { type: answerDescription.type, sdp: answerDescription.sdp }
      });

      statusText.textContent = "Status: Connected!";

      onSnapshot(collection(roomRef, "callerCandidates"), (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === "added") {
            pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });
    };

    function registerPeerListeners() {
      pc.ontrack = (event) => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
      };
    }

    // 5. Controls & Hang Up
    btnMute.onclick = () => {
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      btnMute.textContent = isMuted ? "Unmute Mic" : "Mute Mic";
    };

    btnCam.onclick = () => {
      isCamOff = !isCamOff;
      localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
      btnCam.textContent = isCamOff ? "Turn On Cam" : "Turn Off Cam";
    };

    async function hangUp() {
      if (pc) {
        pc.close();
        pc = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;

      if (currentRoomId) {
        const roomRef = doc(db, "calls", currentRoomId);
        const calleeDocs = await getDocs(collection(roomRef, "calleeCandidates"));
        calleeDocs.forEach(d => deleteDoc(d.ref));
        const callerDocs = await getDocs(collection(roomRef, "callerCandidates"));
        callerDocs.forEach(d => deleteDoc(d.ref));
        await deleteDoc(roomRef);
        currentRoomId = null;
      }

      roomIdInput.value = "";
      btnCopyRoom.disabled = true;
      btnVideoCall.disabled = !auth.currentUser;
      btnVoiceCall.disabled = !auth.currentUser;
      btnMute.disabled = true;
      btnCam.disabled = true;
      btnHangup.disabled = true;
      btnCreateRoom.disabled = true;
      btnJoinRoom.disabled = true;
      statusText.textContent = "Status: Call ended.";
    }

    btnHangup.onclick = hangUp;
  </script>
</body>
</html>
